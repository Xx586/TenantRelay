name: tenantrelay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenantrelay}
      POSTGRES_USER: ${POSTGRES_USER:-tenantrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenantrelay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenantrelay} -d ${POSTGRES_DB:-tenantrelay}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-tenantrelay123}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-tenantrelay123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: production
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tenantrelay}:${POSTGRES_PASSWORD:-tenantrelay}@postgres:5432/${POSTGRES_DB:-tenantrelay}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - .env
    environment:
      TENANTRELAY_SCENARIO: ${TENANTRELAY_SCENARIO:-saas}
      TENANTRELAY_SKILLS_DIR: /app/skills
      SAAS_SKILLS_DIR: /app/scenarios/saas/skills
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tenantrelay}:${POSTGRES_PASSWORD:-tenantrelay}@postgres:5432/${POSTGRES_DB:-tenantrelay}
      REDIS_URL: redis://:${REDIS_PASSWORD:-tenantrelay123}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      SAAS_DEMO_TENANT_ID: ${SAAS_DEMO_TENANT_ID:-demo-tenant}
      SAAS_DEMO_API_KEY: ${SAAS_DEMO_API_KEY:-demo-key-change-me}
      SAAS_AUTH_ENABLED: ${SAAS_AUTH_ENABLED:-true}
      SAAS_DEFAULT_PRODUCT: ${SAAS_DEFAULT_PRODUCT:-AcmeCloud}
      TICKET_PROVIDER: ${TICKET_PROVIDER:-postgres}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: /api
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./backend/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  chroma-data:
  prometheus-data:
